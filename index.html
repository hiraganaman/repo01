<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My GitHub Page</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 24px;
      }
      #d {
        margin-top: 12px;
        min-height: 24px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>ようこそ俺のGithubPageへ！</h2>
    <div id="d"></div>
    <input
      type="button"
      value="現在時刻を表示"
      onclick="document.querySelector('#d').innerHTML = new Date().toLocaleString();"
    />
  </body>
</html>
